spring.application.name=ShowRoom

# Su Render DATABASE_URL viene tradotta da DatabaseUrl e sovrascrive le tre proprieta' datasource
# Variabili locali da .env (formato KEY=valore), opzionale: se manca valgono i default sotto
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/showroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.superuser.email=${SUPERUSER_EMAIL:superuser@showroom.it}
app.superuser.password=${SUPERUSER_PASSWORD:changeme}

# JWT firmato HS256: il secret deve essere >= 32 byte
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# In produzione: ALLOWED_ORIGIN=https://<fe>.onrender.com (piu' valori separati da virgola)
app.cors.allowed-origins=${ALLOWED_ORIGIN:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}}

# Indirizzo del FE usato nei link delle mail (primo valore di ALLOWED_ORIGIN se non impostato)
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

# Gmail: MAIL_PASSWORD e' una password per le app, mai la password dell'account
# e mai un valore di ripiego scritto qui. Con MAIL_USERNAME vuoto l'invio e' disattivato.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Paginazione: limite massimo di elementi per pagina
spring.data.web.pageable.max-page-size=100

# Render assegna la porta in PORT
server.port=${PORT:8080}
server.shutdown=graceful

# Health check per Render
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# spring-boot-starter-mail aggiunge un controllo che apre una connessione a Gmail
# a ogni health check: lento, e senza credenziali fallisce e manda DOWN l'intero
# /actuator/health, cioe' Render dichiarerebbe fallito un deploy sano.
# Che Gmail risponda non dice se il salone funziona: l'avviso di prezzo ha gia'
# il suo flag "inviato" per essere rispedito.
management.health.mail.enabled=false
